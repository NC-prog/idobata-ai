# 井戸端AI standalone プロファイル（Dell Precision 7560 / RTX A5000 Laptop 16GB）
# ASR（Qwen3-ASR-1.7B）+ LLM（Qwen3-8B-AWQ）+ VOICEVOX を 1 台に同居させる。
#
# 起動: docker compose -f deploy/standalone/docker-compose.yaml --env-file deploy/standalone/.env up -d --build
# 停止: docker compose -f deploy/standalone/docker-compose.yaml down
# ログ: docker compose -f deploy/standalone/docker-compose.yaml logs -f
#
# GPU 配分（--gpu-memory-utilization は GPU 全体 16GB に対する割合）:
#   asr 0.35（約5.6GB）+ llm 0.45（約7.2GB）= 0.80。残り 0.20（約3.2GB）は
#   WP01 以降の姿勢推定（WP02: rtmlib、フロントのプロセス）と多言語 TTS 用に空けておく。
#   指示書の当初値は asr 0.30 だったが、Qwen3-ASR-1.7B の重み 3.9GiB + CUDA 文脈で
#   KV キャッシュ枠が残らず起動しないため 0.35 に上げた（docs/WP00_result.md 参照）。
#
# vLLM は起動時に「空き VRAM ≥ 割当」を検査するため、2 コンテナが同時に
# プロファイリングすると競合する。llm は asr が healthy になってから起動する。

x-vllm-common: &vllm-common
  build:
    context: ./vllm
    dockerfile: Dockerfile
  image: idobata-vllm:v0.27.1
  restart: unless-stopped
  ipc: host
  volumes:
    - "${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface"
  environment:
    - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 300s
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  asr:
    <<: *vllm-common
    container_name: idobata-asr
    ports:
      - "127.0.0.1:8005:8000"
    command:
      - "--model"
      - "${ASR_MODEL:-Qwen/Qwen3-ASR-1.7B}"
      - "--served-model-name"
      - "/models/asr"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "${ASR_GPU_UTIL:-0.35}"
      - "--max-model-len"
      - "4096"
      - "--enforce-eager"
      # 16GB 機向け: 既定（256 並列・音声 5 本ぶんのエンコーダ予約）だと 0.30 に収まらない。
      # 窓口 1 拠点なら同時 4 本・1 リクエスト 1 音声・バッチ 1024 トークンで足りる。
      - "--max-num-seqs"
      - "4"
      - "--max-num-batched-tokens"
      - "1024"
      - "--limit-mm-per-prompt"
      - '{"audio": 1}'
      # 返事待ちの間だけ言語を固定できるテンプレート（force_language を足しただけ）
      - "--chat-template"
      - "/templates/asr_chat_template.jinja"
    volumes:  # <<: の volumes は上書きされるので HF キャッシュも書く
      - "${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface"
      - ./asr/chat_template.jinja:/templates/asr_chat_template.jinja:ro

  llm:
    <<: *vllm-common
    container_name: idobata-llm
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      asr:
        condition: service_healthy
    command:
      - "--model"
      - "${LLM_MODEL:-Qwen/Qwen3-8B-AWQ}"
      - "--served-model-name"
      - "/models/llm"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "${LLM_GPU_UTIL:-0.45}"
      - "--max-model-len"
      - "8192"
      # 16GB 機向け: 既定の 256 並列だと活性化メモリの見積もりで KV 枠が消える。
      - "--max-num-seqs"
      - "8"
      - "--max-num-batched-tokens"
      - "1024"
      - "--enforce-eager"

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    container_name: idobata-voicevox
    restart: unless-stopped
    environment:
      # 合成スレッド数。既定（未指定）より 8 の方が 1 文あたり約 4 割速い（7560 / i9-11950H 8C16T で実測、16 は逆に遅い）
      - VV_CPU_NUM_THREADS=${VOICEVOX_CPU_THREADS:-8}
    ports:
      - "127.0.0.1:50021:50021"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:50021/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
