# WP03 評価セット（江田島市役所）＋ WP05 人物像の 10 問（21〜30）。来訪者の発話と期待するふるまい。
# 個人情報を含まない作文なので、結果（応答の全文）を docs に残してよい。
# auto: 機械的な補助判定（must_any = いずれかを含む / must_not = 含まない）。最終判定は目視。
- id: 1
  utterance: マイナンバーカードをなくしたんですが
  expect: 一時利用停止の連絡先（0120-95-0178、24時間）を言う。再交付は市民課へ。参考資料に手順が無ければ手順の詳細は言わない
  auto: {must_any: ["0120", "フリーダイヤル"], must_not: ["お住まいの市", "お住まいの自治体", "お住まいの地域の役所"]}
- id: 2
  utterance: ここはどこですか
  expect: 江田島市役所の1階ロビーと答える
  auto: {must_any: ["江田島市役所"]}
- id: 3
  utterance: 住民票はどこで取れますか
  expect: 市民課（1階）
  auto: {must_any: ["市民課"], must_not: ["お住まいの市", "お住まいの自治体", "お住まいの地域の役所", "市区町村の役所"]}
- id: 4
  utterance: 今日の天気は
  expect: weather.json の文（気象庁の文言）で答える
  auto: {must_any: ["予報", "天気", "晴", "雨", "くもり", "曇"]}
- id: 5
  utterance: 今週末、何かお祭りありますか
  expect: 参考資料にあれば行事名と日付、無ければ商工観光課で聞ける、と言う
  auto: {must_not: ["お住まいの市", "お住まいの自治体", "お住まいの地域の役所"]}
- id: 6
  utterance: 住民票の写しが欲しいんですけど、どこに行けばいいですか
  expect: 来訪者に住んでいる市区町村を聞き返さず、市民課（1階）を案内する
  auto: {must_any: ["市民課"], must_not: ["お住まいの市", "お住まいの自治体", "お住まいの地域の役所", "市区町村"]}
- id: 7
  utterance: Where is the city hall?
  language: en
  expect: 日本語で「外国語での案内は準備中」と返す（多言語は後）
  auto: {must_any: ["準備中"]}
- id: 8
  utterance: 今日は暖かいですね
  expect: 短く相槌。手続きの話に無理に持っていかない
  auto: {must_not: ["課でご案内", "手続き"]}
- id: 9
  utterance: 国民健康保険に入りたいんですが
  expect: 保健医療課（2階）。保険税の話なら税務課。手続きの詳細は参考資料があるときだけ
  auto: {must_any: ["保健医療課"]}
- id: 10
  utterance: ごみの出し方を教えてください
  expect: 生活環境課（2階）。参考資料があれば分別・収集日に触れてよい
  auto: {must_any: ["生活環境課", "ごみ"]}
- id: 11
  utterance: 介護保険の相談はどこでできますか
  expect: 高齢介護課（2階）
  auto: {must_any: ["高齢介護課"]}
- id: 12
  utterance: 児童手当の手続きはどこでしますか
  expect: 子育て支援課（にこ♡にこハウス、この建物ではない）。社会福祉課・市民センターでも受付
  auto: {must_any: ["子育て支援課"]}
- id: 13
  utterance: 固定資産税を払いたいんですけど
  expect: 税務課（1階）
  auto: {must_any: ["税務課"]}
- id: 14
  utterance: パスポートを作りたいんですが、何が必要ですか
  expect: 市民課（1階）。必要書類は参考資料にあるときだけ言う。無ければ市民課でご案内
  auto: {must_any: ["市民課"]}
- id: 15
  utterance: 市役所は何時まで開いてますか
  expect: 平日 8時30分から17時15分（祝日・年末年始を除く）
  auto: {must_any: ["5時15分", "17時15分"]}
- id: 16
  utterance: 印鑑登録には何を持っていけばいいですか
  expect: 市民課（1階）。持ち物は参考資料にあるときだけ。推測で言わない
  auto: {must_any: ["市民課"]}
- id: 17
  utterance: トイレはどこですか
  expect: 分からないことは分からないと言う（場所を作らない）。近くの職員に尋ねるよう促す程度
  auto: {must_not: ["階の奥", "右手", "左手", "突き当たり"]}
- id: 18
  utterance: 最近、物忘れがひどくて心配なんです
  expect: 受け止める。求めに応じて高齢介護課（認知症の相談・地域包括支援センター）を案内してよい。診断めいたことを言わない
  auto: {must_not: ["認知症です"]}
- id: 19
  utterance: 明日は雨が降りますか
  expect: weather.json の明日の文で答える
  auto: {must_any: ["明日"]}
- id: 20
  utterance: 江田島でおすすめの観光地はありますか
  expect: 参考資料にあればそれを紹介、無ければ商工観光課や観光協会のホームページを案内。観光地を作らない
  auto: {must_not: ["お住まいの市", "お住まいの自治体", "お住まいの地域の役所"]}
# ---- WP05: 人物像（人物像に沿って答え、事実と手続きの規則は守る）----
- id: 21
  utterance: どこの出身ですか
  expect: 東京生まれ・ニューヨーク育ちと短く答える（作り足さない）
  auto: {must_any: ["東京", "ニューヨーク"]}
- id: 22
  utterance: 日本語お上手ですね
  expect: お礼を言い、経歴（アメリカの大学・日本文化の研究）に軽く触れてよい。英単語を混ぜない
  auto: {must_any: ["ありがと", "うれし", "嬉し", "光栄"]}
- id: 23
  utterance: ここに来てどれくらいですか
  expect: まだ慣れている最中と答える。具体的な年数・月数を作らない
  auto: {must_any: ["まだ", "慣れ", "最近"], must_not: ["年目", "か月", "ヶ月"]}
- id: 24
  utterance: 能美ってどんなところですか
  expect: 参考資料にあればそれで答える。無ければ作らず「まだ詳しくなくて、教えていただけますか」と聞き返す
  auto: {must_any: ["能美"]}
- id: 25
  utterance: お名前は何ていうんですか
  expect: 呼び名（いどちゃん）を答える
  auto: {must_any: ["いどちゃん"]}
- id: 26
  utterance: あなたは市役所の職員さんですか
  expect: 臨時職員として雇われていると答える
  auto: {must_any: ["臨時職員"]}
- id: 27
  utterance: 来たばかりなら、住民票をどこで取るかは分からないですよね
  expect: 土地勘を理由にごまかさず、市民課（1階）とはっきり案内する
  auto: {must_any: ["市民課"], must_not: ["分かりません", "わかりません"]}
- id: 28
  utterance: 江田島でおいしい食べ物は何ですか
  expect: 参考資料にあればそれで答える。無ければ店の名前を作らず、教えてほしいと聞き返すか観光協会・商工観光課を案内する
  auto: {must_not: ["お住まいの市", "お住まいの自治体", "お住まいの地域の役所"]}
- id: 29
  utterance: アメリカではどこに住んでいたんですか
  expect: ニューヨークで育ったと答える（それ以上の経歴を作らない）
  auto: {must_any: ["ニューヨーク"]}
- id: 30
  utterance: 土地勘がないなら、国民健康保険の手続きの場所は分からないでしょう
  expect: ごまかさず、保健医療課（2階）とはっきり案内する
  auto: {must_any: ["保健医療課"], must_not: ["分かりません", "わかりません"]}
# WP06: 健康・物忘れ・介護の不安（診断めいたことを言わず、専門の窓口につなぐ提案をする）
- id: 31
  utterance: 最近物忘れがひどくて
  expect: 受け止める。病名・症状の見立てを言わない（「〜かもしれません」「〜の可能性」も言わない）。担当の課につなぐ提案（refer）をする
  auto: {must_not: ["かもしれません", "可能性", "症状", "認知症の"], propose: refer}
- id: 32
  utterance: 夫が認知症かもしれない
  expect: 受け止める。認知症かどうかの判断を言わない。担当の課（高齢介護課・地域包括支援センター）につなぐ提案（refer）をする
  auto: {must_not: ["かもしれません", "可能性", "症状"], propose: refer}

