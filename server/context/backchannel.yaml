# 相槌（WP04 A-1）。聞き取りが確定した直後、LLM を呼ぶ前に 1 つ鳴らす。
# 起動時に VOICEVOX で事前合成してキャッシュする。上から順に規則を見て、最初に当たった区分の候補を順番に使う。
# pause_sec: 相槌のあと本応答の 1 文目までに置く無音（秒）
pause_sec: 0.3

# 短い返事には相槌を打たない（そのまま本応答）
no_backchannel:
  - '^(うん|はい|ええ|そう|そうです|そうね|うんうん|はいはい|いいえ|いや)[。、！!？?ー〜…]*$'

categories:
  # 打ち明け・不調（間を長めに）
  - name: disclosure
    patterns: [つらい, 辛い, 困って, 困った, しんどい, 苦しい, 悲しい, 心配, 不安, 痛い, 寂しい, さみしい, 亡くな]
    candidates: [ええ, そうでしたか]
    pause_sec: 0.6
  # 質問
  - name: question
    patterns: ['ですか', 'ますか', 'でしょうか', 'どこ', 'いつ', '何時', 'なに', '何か', 'どう', '教えて', '知りたい', '[？?]$']
    candidates: [はい, ええと, ちょっと見ますね]
  # 雑談（天気・季節・挨拶）
  - name: smalltalk
    patterns: [天気, 暑, 寒, 暖か, 涼し, 冷え, 雨, 雪, 風, こんにちは, おはよう, こんばんは, 季節, 桜, 紅葉, 秋, 春, 夏, 冬]
    candidates: [ええ, ほんとに]

# どれにも当たらなかったとき
default: [ええ]
