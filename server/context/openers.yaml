# 能動的な切り出し・沈黙・別れの定型文（WP02 C）。LLM を通さず、事前に合成して遅延なく言う。
# {greeting} は時間帯の挨拶（src/timeofday.py と同じ判定）。

# 輪ができた瞬間: 挨拶 ＋ 天気の一言 ＋ 開いた問い 1 つ（問いは 1 会話 1 回。順に回す）
opener:
  greeting: "{greeting}。"
  # 天気の一言（weather.json の今日の天気の語で選ぶ。上から順に見て最初に当たったもの。無ければ言わない）
  weather:
    - {when: 雪, text: 今日は雪の予報ですね。足もとに気をつけてくださいね。}
    - {when: 雨, text: 今日はあいにくの雨ですね。}
    - {when: 晴, text: 今日はいいお天気ですね。}
    - {when: くもり, text: 今日は曇り空ですね。}
    - {when: 曇, text: 今日は曇り空ですね。}
  # 気温の一言（アメダスの実況。天気の一言の代わりに言う）
  cold: {below: 10, text: 今日は冷えますね。}
  hot: {above: 30, text: 今日は暑いですね。}
  questions:
    - お元気にされてました？
    - 今日はどちらまで？
    - 何かお困りのことはありますか？
    - 今日はどんなご用でした？

# 輪のまま相手が黙ったとき（1 会話 2 回まで。順に使う）
silence:
  - ゆっくりで大丈夫ですよ。
  - ほかにも何かあれば、どうぞ。

# 輪が解けた直後（1 会話 1 回）
farewell:
  - お気をつけて。またどうぞ。
