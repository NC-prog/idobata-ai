# 手続きの別名表（全拠点共通）。
#
# - term: 拠点 YAML の facility.departments[].handles と突き合わせる名前（handles の語と同じ表記にする）
# - aliases: 来訪者の言い方（略称・表記ゆれ・関連する手続き）。発話にこれがあれば term を言ったものとみなす
# ASR の語彙には term と aliases をすべて入れる（asr_exclude に書いたものを除く）
#
# 担当課は規則で決める（src/procedures.py）。承認済みの手続きナレッジ（WP09。~/idobata-data/procedures/<site>/）の
# name・aliases が発話にあればその department、残りはこの表の term を handles に持つ課。一意でなければ「未特定」。
# readings は VOICEVOX のユーザー辞書に登録する語（読みが自明でないものだけ）。
#
# 紹介状の聞き取り（intake）と持ち物（bring）は WP09 で手続きナレッジに移した（二重管理をやめる）。
# tags: 紹介状のタグ（tags.yaml の統制語彙）。手続きが分かったときは LLM の選んだタグより先に付ける（LLM は補助）

procedures:
  - term: 国民健康保険
    tags: [保険・年金]
    aliases: [国保]
  - term: 国民健康保険税
    tags: [税]
    aliases: [国保税, 国民健康保険料, 国保料]
  - term: 後期高齢者医療
    tags: [保険・年金]
    aliases: [後期高齢]
  - term: 介護保険
    tags: [介護]
    aliases: [要介護認定, 介護認定, 介護]
  - term: 児童手当
    tags: [子育て]
  - term: 保育施設
    tags: [子育て]
    aliases: [保育所, 保育園]
  - term: 住民票
    tags: [住民票・戸籍]
  - term: 住民登録
    tags: [住民票・戸籍]
    aliases: [転入, 転出, 転居]
  - term: 戸籍
    tags: [住民票・戸籍]
  - term: 印鑑登録
    tags: [住民票・戸籍]
    aliases: [印鑑証明]
  - term: 税証明書
    tags: [税]
    aliases: [課税証明, 納税証明]
  - term: マイナンバーカード
    tags: [マイナンバー]
  - term: パスポート
  - term: ごみ
    tags: [ごみ]
    aliases: [粗大ごみ]
  - term: 水道

# ASR に渡さない語（handles と突き合わせるためだけの正式名や、言い方の揺れ。語彙が長いと聞き取りが鈍る）
asr_exclude: [国民健康保険税, 国保税, 国民健康保険料, 国保料, 後期高齢, 介護認定, 介護, 保育施設, 保育園, 住民登録, 税証明書]

# 聞き取り間違いの対応表。ASR の出力をこの表で直してから対話と課の照合に渡す（長い表記から順に置き換える）。
# 職員パネルからも 1 行ずつ足せる（足した行はデータディレクトリの asr_fixes.jsonl）
asr_fixes:
  - {surface: 国宝, correct: 国保}
  - {surface: 後期好礼, correct: 後期高齢}
  - {surface: 後期高例, correct: 後期高齢}
  - {surface: 伊豆ちゃん, correct: いどちゃん}   # アバターの呼び名（IDOBATA_AVATAR_NAME の初期値）

readings:
  - {surface: 国保, reading: コクホ, accent: 1}
  - {surface: 後期高齢, reading: コウキコウレイ, accent: 4}
