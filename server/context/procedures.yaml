# 手続きの別名表（全拠点共通）。
#
# - term: 拠点 YAML の facility.departments[].handles と突き合わせる名前（handles の語と同じ表記にする）
# - aliases: 来訪者の言い方（略称・表記ゆれ・関連する手続き）。発話にこれがあれば term を言ったものとみなす
# - departments: handles を持たない課で、名前で担当が分かるもの（「選挙管理委員会事務局」）。拠点に無ければ使わない
# 候補の課が複数あり、そのうちこの建物の課（facility で place の無い課）が 1 つだけなら、その課にする（WP09。支所より本庁）
# ASR の語彙には term と aliases をすべて入れる（asr_exclude に書いたものを除く）
#
# 担当課は規則で決める（src/procedures.py）。承認済みの手続きナレッジ（WP09。~/idobata-data/procedures/<site>/）の
# name・aliases が発話にあればその department、残りはこの表の term を handles に持つ課。一意でなければ「未特定」。
# readings は VOICEVOX のユーザー辞書に登録する語（読みが自明でないものだけ）。
#
# 紹介状の聞き取り（intake）と持ち物（bring）は WP09 で手続きナレッジに移した（二重管理をやめる）。
# tags: 紹介状のタグ（tags.yaml の統制語彙）。手続きが分かったときは LLM の選んだタグより先に付ける（LLM は補助）

procedures:
  - term: 国民健康保険
    tags: [保険・年金]
    aliases: [国保]
  - term: 国民健康保険税
    tags: [税]
    aliases: [国保税, 国民健康保険料, 国保料]
  - term: 後期高齢者医療
    tags: [保険・年金]
    aliases: [後期高齢]
  - term: 介護保険
    tags: [介護]
    aliases: [要介護認定, 介護認定, 介護]
  - term: 児童手当
    tags: [子育て]
  - term: 保育施設
    tags: [子育て]
    aliases: [保育所, 保育園]
  - term: 住民票
    tags: [住民票・戸籍]
  - term: 住民登録
    tags: [住民票・戸籍]
    aliases: [転入, 転出, 転居]
  - term: 戸籍
    tags: [住民票・戸籍]
    aliases: [死亡届, 婚姻届, 出生届, 離婚届, 戸籍謄本, 戸籍抄本]
  - term: 印鑑登録
    tags: [住民票・戸籍]
    aliases: [印鑑証明]
  - term: 税証明書
    tags: [税]
    aliases: [課税証明, 納税証明]
  - term: マイナンバーカード
    tags: [マイナンバー]
  - term: パスポート
  - term: ごみ
    tags: [ごみ]
    aliases: [粗大ごみ]
  - term: 水道
  # WP09 の網羅試験で、LLM が担当でない課を言った手続き（犬の登録→市民課、期日前投票→市民課、転校→市民課 など）
  - term: 動物
    aliases: [犬の登録, 犬を飼, 飼い犬, 狂犬病]
  - term: 狂犬病予防
    aliases: [犬の登録, 犬を飼, 飼い犬, 狂犬病]
  - term: 選挙
    departments: [選挙管理委員会事務局]
    aliases: [期日前投票, 不在者投票]
  - term: 転学
    departments: [学校教育課]
    aliases: [転校, 学校をかわ, 学校かわ, 学校が変わ, 転入学]
  - term: 就職支援
    tags: [仕事・事業]
    aliases: [仕事を探, 仕事探し, 求人]
  - term: 職業相談
    tags: [仕事・事業]
    aliases: [仕事を探, 仕事探し, 求人]
  - term: 地域包括支援センター
    tags: [介護]
    aliases: [包括支援センター, 年寄りのこと, 高齢者の相談]
  - term: 高齢者総合相談
    tags: [介護]
    aliases: [地域包括支援センター, 包括支援センター, 年寄りのこと, 高齢者の相談]

# ASR に渡さない語（handles と突き合わせるためだけの正式名や、言い方の揺れ。語彙が長いと聞き取りが鈍る）
asr_exclude: [国民健康保険税, 国保税, 国民健康保険料, 国保料, 後期高齢, 介護認定, 介護, 保育施設, 保育園, 住民登録, 税証明書,
              死亡届, 婚姻届, 出生届, 離婚届, 戸籍謄本, 戸籍抄本, 動物, 犬の登録, 犬を飼, 飼い犬, 狂犬病予防, 選挙, 転学,
              学校をかわ, 学校かわ, 学校が変わ, 転入学, 就職支援, 職業相談, 仕事を探, 仕事探し, 求人, 包括支援センター,
              年寄りのこと, 高齢者の相談, 高齢者総合相談]

# 聞き取り間違いの対応表。ASR の出力をこの表で直してから対話と課の照合に渡す（長い表記から順に置き換える）。
# 職員パネルからも 1 行ずつ足せる（足した行はデータディレクトリの asr_fixes.jsonl）
asr_fixes:
  - {surface: 国宝, correct: 国保}
  - {surface: 後期好礼, correct: 後期高齢}
  - {surface: 後期高例, correct: 後期高齢}
  - {surface: 伊豆ちゃん, correct: いどちゃん}   # アバターの呼び名（IDOBATA_AVATAR_NAME の初期値）
  # 「児童」が「自動」になる（2026-10-24 の実機確認。語彙の先頭近くに「児童手当」があっても負ける）。長い表記から当てる
  - {surface: 自動手当店, correct: 児童手当}
  - {surface: 自動手当て, correct: 児童手当}
  - {surface: 自動手当, correct: 児童手当}
  - {surface: 自動扶養手当, correct: 児童扶養手当}   # 特別自動扶養手当 → 特別児童扶養手当 もこれで直る

readings:
  - {surface: 国保, reading: コクホ, accent: 1}
  - {surface: 後期高齢, reading: コウキコウレイ, accent: 4}
