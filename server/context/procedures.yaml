# 手続きの常用語（全拠点共通）。
#
# - term: 拠点 YAML の facility.departments[].handles と突き合わせる名前（handles の語と同じ表記にする）
# - aliases: 来訪者の言い方（略称・表記ゆれ・関連する手続き）。発話にこれがあれば term を言ったものとみなす
# ASR の語彙には term と aliases をすべて入れる（asr_exclude に書いたものを除く）
#
# 担当課は規則で決める（src/procedures.py）。発話から term を拾い、handles にその term を持つ課が
# 一つなら確定、複数なら来訪者に聞き、無ければ LLM の候補を来訪者に確かめる。
# readings は VOICEVOX のユーザー辞書に登録する語（読みが自明でないものだけ）。
#
# intake: 紹介状の同意の後に伺う項目（担当の方が準備できるように）。when の語が発話にあればその組を使う
#   （when が無い組は常に合う）。questions は最大 3 問、LLM が自然な言い方に直して順に聞く。
#   bring は持ち物の案内（when の語が聞き取りの答えか発話にあれば。when 無しは常に）。最初に合った 1 つだけ言う

procedures:
  - term: 国民健康保険
    aliases: [国保]
    intake:
      - questions: [切り替えのきっかけ（退職・転入・扶養の変更など）, いつから切り替えるか, 手続きするのはご本人かご家族か]
        bring:
          - {when: [退職, 辞め, 扶養, 会社], item: 前の健康保険の資格喪失証明書}
          - {when: [転入, 引っ越], item: 前の市町村の転出証明書}
  - term: 国民健康保険税
    aliases: [国保税, 国民健康保険料, 国保料]
  - term: 後期高齢者医療
    aliases: [後期高齢]
  - term: 介護保険
    aliases: [要介護認定, 介護認定, 介護]
    intake:
      - questions: [介護が要るのはご本人かご家族か, 初めての申請か更新か]
        bring:
          - {when: [更新], item: 介護保険の被保険者証}
  - term: 児童手当
  - term: 保育施設
    aliases: [保育所, 保育園]
  - term: 住民票
  - term: 住民登録
    aliases: [転入, 転出, 転居]
  - term: 戸籍
  - term: 印鑑登録
    aliases: [印鑑証明]
  - term: 税証明書
    aliases: [課税証明, 納税証明]
  - term: マイナンバーカード
    intake:
      - when: [紛失, なくし, 無くし, 失くし, 落とし, 盗]
        questions: [マイナンバー総合フリーダイヤルへの一時停止の連絡は済んだか, 再交付を希望するか]
        bring:
          - {item: 本人確認の書類（運転免許証など）}
  - term: パスポート
  - term: ごみ
    aliases: [粗大ごみ]
  - term: 水道

# ASR に渡さない語（handles と突き合わせるためだけの正式名や、言い方の揺れ。語彙が長いと聞き取りが鈍る）
asr_exclude: [国民健康保険税, 国保税, 国民健康保険料, 国保料, 後期高齢, 介護認定, 介護, 保育施設, 保育園, 住民登録, 税証明書]

# 聞き取り間違いの対応表。ASR の出力をこの表で直してから対話と課の照合に渡す（長い表記から順に置き換える）。
# 職員パネルからも 1 行ずつ足せる（足した行はデータディレクトリの asr_fixes.jsonl）
asr_fixes:
  - {surface: 国宝, correct: 国保}
  - {surface: 後期好礼, correct: 後期高齢}
  - {surface: 後期高例, correct: 後期高齢}

readings:
  - {surface: 国保, reading: コクホ, accent: 1}
  - {surface: 後期高齢, reading: コウキコウレイ, accent: 4}
