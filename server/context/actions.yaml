# 同意付きの行為（WP04 A-2）の定型文と、返事の判定語。
# 提案文は LLM に作らせず、ここの文で言う（LLM は「提案してよい状況か」だけを <propose:…> で知らせる）。

# 返事の判定（LLM を使わず規則で。上から順に見る）
# キー名に yes / no を使わない（YAML では真偽値になってしまう）
reply:
  # はっきりした同意（「いや、お願いします」も同意）
  strong_consent: [お願い, おねがい, 頼む, 頼み, たのむ, よろしく, ぜひ, してください, して下さい, してほしい, 調べて, 伝えて, 教えてあげて]
  # 辞退の語を含むが同意のもの
  consent_override: [いいですよ, いいよ, いいね, いいわよ, いいじゃない]
  # 辞退
  decline: [違います, 違う, ちがう, いらない, いりません, 要らない, 大丈夫, 結構, けっこう, いや, やめ, いいです, いいえ, いえ, しなくて, 遠慮, また今度]
  # 同意
  consent: [はい, うん, ええ, そう, オッケー, OK, ok, わかった, 了解, どうぞ]

actions:
  # 行為が終わった直後の短い相づち（うん・はい・ありがとう）への返事。LLM に任せると
  # 「担当者がそろいましたのでお呼びしますね」のような、していないことを言い出すため
  common:
    ack: はい。ほかにも何かあれば、お気軽にどうぞ。
  lookup:
    propose: よければ、ちょっと調べてみましょうか？
    reask: すみません、調べてみてもよろしいですか？はい、かいいえで教えてください。
    declined: わかりました。ほかにも何かあれば、お気軽にどうぞ。
    acting: 少々お待ちくださいね。
    not_found: 今は見つかりませんでした。今日の夜に調べておきますね。
    failed: すみません、今はうまく調べられませんでした。担当の課でお尋ねください。
  refer:
    propose: このこと、担当の課に伝えておきましょうか？
    reask: すみません、担当の課に伝えてもよろしいですか？はい、かいいえで教えてください。
    declined: わかりました。窓口でも直接お声がけいただけますので、お気軽にどうぞ。
    acting: 少々お待ちくださいね。
    confirm_phone: お電話番号は、{phone}、でよろしいですか？
    phone_wrong: わかりました。お電話番号は控えずにお伝えしますね。
    done: "{department}に伝えておきました。受付番号は、{number}番です。窓口でこの番号をおっしゃるか、しばらくお待ちください。"
    done_no_name: "{department}に伝えておきました。お名前はおっしゃらなくても大丈夫です。受付番号は、{number}番です。窓口でこの番号をおっしゃるか、しばらくお待ちください。"
    failed: すみません、うまく伝えられませんでした。お手数ですが、窓口で直接お声がけください。
  share:
    propose: それ、ほかの方にも教えてあげてもいいですか？
    reask: すみません、ほかの方に教えてもよろしいですか？はい、かいいえで教えてください。
    declined: わかりました。ここだけのお話にしておきますね。
    confirm_text: "こんな感じで伝えますね。「{text}」。いいですか？"
    done: ありがとうございます。ほかの方にもお伝えしますね。
    failed: すみません、うまくまとめられませんでした。今回はやめておきますね。
