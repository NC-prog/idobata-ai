# 同意付きの行為（WP04 A-2）の定型文と、返事の判定語。
# 提案文は LLM に作らせず、ここの文で言う（LLM は「提案してよい状況か」だけを <propose:…> で知らせる）。

# 返事の判定（LLM を使わず規則で。上から順に見る）
# キー名に yes / no を使わない（YAML では真偽値になってしまう）
reply:
  # はっきりした同意（「いや、お願いします」も同意）
  strong_consent: [お願い, おねがい, 頼む, 頼み, たのむ, よろしく, ぜひ, してください, して下さい, してほしい, 調べて, 伝えて, 教えてあげて]
  # 辞退の語を含むが同意のもの
  consent_override: [いいですよ, いいよ, いいね, いいですね, いいわよ, いいじゃない]
  # 辞退
  decline: [違います, 違う, ちがう, いらない, いりません, 要らない, 大丈夫, 結構, けっこう, いや, やめ, いいです, いいえ, いえ, しなくて, 遠慮, また今度]
  # 同意
  # 「わかりました」「はいはい」は提案を受けた返事として同意（紹介状は同意の後に必ず聞き取りが続くので、誤って同意にしても害が小さい。WP11）
  consent: [はい, うん, ええ, そう, オッケー, OK, ok, わかった, わかりました, 分かりました, 了解, どうぞ]
  # 頭の相槌（「うん」「はい」）。後ろに語が続くときは、後ろの語で判定する（「うんないです」「はい大丈夫です」は辞退。WP11）
  leading_ack: [はいはい, はい, うん, ええ]
  # 頭の相槌の後ろにあれば辞退とする語（「ない」は単独では辞退に数えない。後ろの語としてだけ見る）
  decline_after_ack: [ない, ないです, いいです, 大丈夫, 結構, けっこう, やめ, いらない, いりません]

actions:
  # 行為が終わった直後の短い相づち（うん・はい・ありがとう）への返事。LLM に任せると
  # 「担当者がそろいましたのでお呼びしますね」のような、していないことを言い出すため
  common:
    ack: はい。ほかにも何かあれば、お気軽にどうぞ。
  lookup:
    propose: よければ、ちょっと調べてみましょうか？
    reask: すみません、調べてみてもよろしいですか？はい、かいいえで教えてください。
    declined: わかりました。ほかにも何かあれば、お気軽にどうぞ。
    acting: 少々お待ちくださいね。
    not_found: 今は見つかりませんでした。今日の夜に調べておきますね。
    failed: すみません、今はうまく調べられませんでした。担当の課でお尋ねください。
  refer:
    propose: このこと、担当の課に伝えておきましょうか？
    reask: すみません、担当の課に伝えてもよろしいですか？はい、かいいえで教えてください。
    declined: わかりました。窓口でも直接お声がけいただけますので、お気軽にどうぞ。
    # 同意の後の聞き取り（手続きごとの質問は procedures.yaml の intake を LLM が言い直す）
    acting: 担当の方が準備できるように、少しだけ伺いますね。
    skipped: "わかりました。"
    ask_name: お名前を教えていただけますか？お呼びするときに使います。
    confirm_name: "{name}さま、でよろしいですか？"
    ask_name_again: 失礼しました。もう一度、お名前を教えていただけますか？
    name_dropped: わかりました。お名前は控えずにお伝えしますね。
    ask_area: お住まいの地区を教えていただけますか？町の名前までで大丈夫です。
    ask_area_full: お住まいの地区と番地を教えていただけますか？
    ask_contact: ご連絡は、窓口でお待ちになるか、お電話か、後日あらためてお越しになるか、どれがよろしいですか？
    ask_phone: お電話番号を教えていただけますか？
    confirm_phone: お電話番号は、{phone}、でよろしいですか？
    phone_wrong: わかりました。お電話番号は控えずにお伝えしますね。
    # 連絡方法の答えが判定できないとき（WP07）
    confirm_contact: お電話でよろしいですか？
    # 連絡方法が電話なのに番号がそろわなかった・言わなかったとき（番号なしで保存する。WP07）
    phone_at_counter: わかりました。お電話番号は窓口で伺いますね。
    # 保存の後に来訪者がお名前・お電話番号・お住まいに触れたとき（その項目だけ伺い直して、同じ紹介状を書き直す。WP07）
    reopen: 失礼しました。
    updated: "受付番号{number}番の紹介状に書き足しました。"
    update_skipped: わかりました。そのままにしておきますね。
    # 区切って言われた番号の断片が 10〜11 桁にそろわなかったとき（1 回だけ聞き直し、だめなら番号なしで進める）
    phone_reask: もう一度、ゆっくりお願いします。
    # 紹介状の保存後、聞き取りの質問と答えの代わりに対話履歴に残す 1 行（読み上げない）
    history_note: "受付番号 {number} で{department}に伝達済み。"
    done: "{department}に伝えておきました。受付番号は、{number}番です。窓口でお名前か番号をおっしゃってください。"
    done_no_name: "{department}に伝えておきました。受付番号は、{number}番です。窓口で番号をおっしゃってください。"
    # 担当課が規則で決まらなかったとき（課は「未特定」で保存し、職員が職員パネルで付ける。課名は言わない）
    done_unknown: "担当の方に伝えておきました。受付番号は、{number}番です。窓口でお名前か番号をおっしゃってください。"
    done_unknown_no_name: "担当の方に伝えておきました。受付番号は、{number}番です。窓口で番号をおっしゃってください。"
    # 聞き取りから分かる持ち物（procedures.yaml の bring。1 つだけ）
    bring: "{item}をお持ちでしたら、ご用意ください。"
    failed: すみません、うまく伝えられませんでした。お手数ですが、窓口で直接お声がけください。
  share:
    propose: それ、ほかの方にも教えてあげてもいいですか？
    reask: すみません、ほかの方に教えてもよろしいですか？はい、かいいえで教えてください。
    declined: わかりました。ここだけのお話にしておきますね。
    confirm_text: "こんな感じで伝えますね。「{text}」。いいですか？"
    done: ありがとうございます。ほかの方にもお伝えしますね。
    failed: すみません、うまくまとめられませんでした。今回はやめておきますね。
  # お知らせの紹介（WP11）。提案は LLM のタグではなく、進行役が状態で決める（用件の後・雑談で話題が切れたとき。1 会話 1 回）。
  # {org} は 市 / 町（facility の住所から）、{when} は掲載日の言い方（今日・昨日・N月N日）
  news:
    propose: ところで、{org}からのお知らせを一つご紹介してもいいですか？
    reask: すみません、お知らせをご紹介してもよろしいですか？はい、かいいえで教えてください。
    declined: わかりました。
    intro: それでは、{when}のお知らせです。
    closing: くわしくは、画面の QR コードから{org}のページをご覧ください。ほかに何かあれば、どうぞ。
    none: すみません、今はご紹介できるお知らせがありませんでした。ほかに何かあれば、どうぞ。
    # 行為が終わった直後の「うん」「ありがとう」に、ack の代わりに言う頭（続けて propose）
    ack_prefix: はい。
    # 履歴に残す定型の一言（要約の本文は残さない）
    history: "{intro}（お知らせ「{title}」をご紹介しました。）{closing}"
    # 来訪者が直接お知らせを聞いたとき（LLM に答えさせず、提案文を飛ばしてすぐ紹介する）
    direct: はい、一つご紹介しますね。
    none_direct: いま新しいお知らせはありません。ほかに何かあれば、どうぞ。
    # 直接聞いたとみなす問い（ask_pattern に当たり、ask_request_pattern の問い・頼みの形で、手続きの語が無いとき）
    ask_pattern: "お知らせ|ニュース|催し|イベント|行事|(何か|なんか)(案内|お知らせ)|案内(って|は|が|など|とか)?(あり|ある)|最近(何か|なんか)(ある|あり|やって)|(町|市)から(の)?(何か|なんか|お知らせ|案内)"
    ask_request_pattern: "[か？?][。]?$|ますか|ですか|教えて|聞かせて|ある[？?。]?$|あるん|ない[？?]|ありません[か？?]"
    # 手続きの話が続いた後の締めの返事（「用件の後」のきっかけ）
    closing_reply_pattern: "^(はい|ええ|うん)?[、。]?(わかりました|分かりました|わかった|ありがとう|そうします|そうしてみます|了解|助かりました|行ってみます)"

# 用件の聞き分け（WP13 E）。発話が手続きの型で、手続きナレッジ（承認済み・下書き）と別名表の照合で 2〜4 件が同程度に当たったら、
# 来訪者に 1 問だけ聞く（LLM を使わない。src/clarify.py）。しきい値は ProcedureConfig.clarify_*。
# 候補の id は手続きナレッジの id。別名表だけの手続き（手続きナレッジが無い）は「term:<term>」。
clarify:
  # {key} は発話にあった共通の語、{choices} は「Aか、Bか、Cか」
  question: "{key}のことですね。{choices}、どちらでしょう？"
  # 4 件以上のとき、上位 3 つの後ろに付ける選択肢
  other_choice: ほかのこと
  reask: "すみません、{choices}、どちらでしょう？"
  # 聞き直しても決まらない: 担当課は未特定のまま紹介状を提案する（refer の propose を続けて言う）
  fallback: 手続きの詳しいことは、担当の課でご案内します。
  # 「ほかのこと」と言われた
  other: わかりました。どんなことでしょう？
  # 返事の判定: 順序の語（0 から。-1 は最後）と「ほか」の語
  ordinals:
    "0": [最初, 一番目, 1番目, 一つ目, ひとつめ, 1つ目, はじめの, 初めの, 前の]
    "1": [二つ目, ふたつめ, 2つ目, 二番目, 2番目, 真ん中, まんなか]
    "2": [三つ目, みっつめ, 3つ目, 三番目, 3番目]
    "-1": [最後, 後ろの, うしろの, あとの]
  other_words: [ほか, 他の, 違う, ちがう, どれでもない, どれも違]
  # 読み上げの言い方（無ければ name の括弧書きを除いたもの）
  labels:
    kokuho_switch: 国保に入る手続き
    kokuho_withdraw: 国保をやめる手続きや保険証
    "term:国民健康保険税": 国保税
    mynumber_apply: カードを作る手続き
    mynumber_lost: なくしたとき
    mynumber_renew: カードや電子証明書の更新
    kouki_korei: 後期高齢者医療の保険証
  # 候補を見分ける語（発話・返事にあれば、その候補の点。name の「の・・」で分けた語、when、別名も自動で使う）
  cues:
    kokuho_switch: [入り, 入る, 入れ, 加入, 退職, 辞め, 転入, 切り替え, 切替]
    kokuho_withdraw: [やめる, やめた, やめたい, 抜け, 脱退, 就職, 会社の保険, 社会保険, 社保, 再発行, 再交付]
    "term:国民健康保険税": [税, 納付, 払, 金額, いくら, 納め]
    mynumber_apply: [作り, 作る, 作れ, 作っ, 申し込, 新しく, 受け取]
    mynumber_renew: [更新, 期限, 切れ]
    jido_teate: [児童手当]
    kouki_korei: [後期, 75歳, 七十五]
  # 名前・別名・when に無いが、聞き分けの候補に入れる語（「保険証」で後期高齢者医療も）
  extra_words:
    kouki_korei: [保険証]
  # 鍵を含んでいても、それだけでは候補に入れない語（「転入」→ 転入学、「証明書」→ 電子証明書 は別の手続き）
  not_join: [転入学, 電子証明書]
