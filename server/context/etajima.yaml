# ===== 拠点の固定事実（WP03。システムプロンプトに直書き。出典と確認日は docs/WP03_result.md）=====
facility:
  name: 江田島市役所
  location_phrase: 江田島市役所の1階ロビー
  address_city: 江田島市
  hours: 月曜日から金曜日（祝祭日・年末年始を除く） 午前8時30分から午後5時15分まで
  departments:
    - name: 市民課
      floor: 1階
      handles: [戸籍, 住民票, 住民登録, 印鑑登録, 各種証明書の発行, マイナンバーカード, パスポート]
    - name: 税務課
      floor: 1階
      handles: [市民税・県民税, 固定資産税, 軽自動車税, 国民健康保険税, 法人市民税, 税証明書, 市税の納付]
    - name: 会計課
      floor: 1階
      handles: [支払金の口座振込依頼, 指定公金事務取扱者の指定]
    - name: 生活環境課
      floor: 2階
      handles: [ごみ, 環境, 浄化槽, 墓地・墓苑, 動物, 太陽光発電]
    - name: 社会福祉課
      floor: 2階
      handles: [障害者手帳・障害福祉サービス, 自立支援医療, 特別児童扶養手当, 障害児福祉手当・特別障害者手当, 生活保護, 生活困窮の相談, 住居確保給付金, 民生委員児童委員]
    - name: 保健医療課
      floor: 2階
      handles: [国民健康保険, 後期高齢者医療, こども・重度身障者・ひとり親医療, 被爆者支援, 健康推進, マイナンバーカードの健康保険証利用, 夜間・休日の受診案内]
    - name: 高齢介護課
      floor: 2階
      handles: [介護保険, 高齢者福祉, 地域包括支援センター, 介護予防, 認知症の相談]
    - name: 商工観光課
      floor: 2階
      handles: [観光, 民泊・体験型修学旅行, 企業立地, 中小企業者支援, 就職支援・求人情報]
    - name: 子育て支援課
      place: にこ♡にこハウス（江田島町中央四丁目18番28号）
      handles: [母子保健, 妊婦・乳児健康診査, 保育施設, 子育て支援, 児童手当, 児童扶養手当]
    - name: 総務課
      floor: 3階
    - name: 財政課
      floor: 3階
    - name: 財産管理課
      floor: 3階
    - name: 企画振興課
      floor: 3階
    - name: デジタル改革課
      floor: 3階
    - name: 農林水産課
      floor: 3階
    - name: 選挙管理委員会事務局
      floor: 3階
    - name: 農業委員会事務局
      floor: 3階
    - name: 危機管理課
      floor: 4階
    - name: 建設課
      floor: 4階
    - name: 都市整備課
      floor: 4階
    - name: まちづくり共生課
      place: 大柿市民センター（大柿町大原535番地2）
    - name: 下水道課
      place: 江田島市民センター本館1階（江田島町中央一丁目1番1号）
    - name: 学校教育課
      place: 能美市民センター本館3階（能美町中町4859番地9）
    - name: 生涯学習課
      place: 能美市民センター本館3階
  notes:   # 固定事実として話してよい補足（出典は docs/WP03_result.md）
    - マイナンバーカードの申請・交付は、毎月第2金曜日に午後7時30分まで受付時間延長窓口があります（予約制。前日までに市民課へ電話またはLINE。予約が無い日は延長しません）
    - 児童手当・児童扶養手当は子育て支援課（にこ♡にこハウス）のほか、社会福祉課と各市民センターでも受け付けています
    - 国民健康保険の資格や給付は保健医療課、国民健康保険税は税務課です
    - 住民票の写しなどの証明書は、本庁の市民課（1階）のほか、市民センター（江田島・能美・沖美）・三高支所・各出張所・各連絡所・市民サービスセンターでも取れます（市「住民票などの窓口発行」cms/articles/show/9557）
    - 江田島市の観光の情報は江田島市観光協会のホームページにも載っています
    - 宮島（厳島神社）は廿日市市にあり、江田島市ではありません
    - マイナンバーカードをなくしたときの順序（市の「マイナンバーカードを紛失した場合」のページ）。1 まずマイナンバー総合フリーダイヤルに電話して一時停止する。2 家の外でなくしたときや盗まれたときは警察署に遺失届を出す。3 見つからないときは、市役所本庁・各市民センター（江田島・能美・沖美）・三高支所で再交付の手続きをする。見つかったときは同じ窓口で一時停止の解除の手続きをする
  facilities_in_building:   # 館内の設備（公式サイトで分かるものだけ。載っていない設備は「近くの職員にお尋ねください」）
    - name: AED
      location: 1階ロビー     # 市「市が所有している施設が管理しているAED（令和８年８月現在）」PDF（cms/articles/show/4553）
    # トイレ・エレベーター・授乳室・駐車場の配置は公式サイトで確認できず（docs/市への確認事項.md の 2）
  emergency_lines:
    - name: マイナンバー総合フリーダイヤル（マイナンバーカードを紛失したときの一時利用停止。24時間365日・通話無料。音声ガイダンスで2番）
      number: 0120-95-0178
    # ---- 全国共通の相談先（WP09。深刻な打ち明けの定型で、種類 crisis に合う番号を 1 つ読み上げ、残りは字幕だけ）----
    # 市（町）の相談窓口の番号をもらったら差し替える（docs/市への確認事項.md の 7）。確認日 2026-10-23
    # 厚生労働省「まもろうよ こころ」電話相談 https://www.mhlw.go.jp/mamorouyokokoro/soudan/tel/
    #   こころの健康相談統一ダイヤル 0570-064-556（ナビダイヤル、通話料がかかる。曜日・時間は都道府県で異なる）
    #   よりそいホットライン 0120-279-338（24時間対応）
    - name: こころの健康相談統一ダイヤル（ナビダイヤル。通話料がかかる。受付の曜日・時間は都道府県で異なる）
      number: 0570-064-556
      crisis: kokoro
    - name: よりそいホットライン（24時間・通話無料）
      number: 0120-279-338
      crisis: kokoro_more
    # 内閣府男女共同参画局「DV相談ナビ」 https://www.gender.go.jp/policy/no_violence/e-vaw/soudankikan/01.html
    #   ＃８００８（お住まいの都道府県の配偶者暴力相談支援センターにつながる）
    - name: DV相談ナビ（配偶者などからの暴力の相談。お住まいの都道府県の相談支援センターにつながる）
      number: "#8008"
      spoken: シャープ8008
      crisis: dv
    # こども家庭庁「児童相談所虐待対応ダイヤル「189」について」 https://www.cfa.go.jp/policies/jidougyakutai/gyakutai-taiou-dial/
    #   189（いちはやく）。通話料無料・匿名可
    - name: 児童相談所虐待対応ダイヤル（通話無料・匿名で相談できる）
      number: "189"
      spoken: 1 8 9（いちはやく）
      crisis: abuse
    # 警察庁「ご意見・ご相談」 https://www.npa.go.jp/goiken/index.html
    #   事件や事故に関する緊急通報は110番。緊急でない相談は最寄りの警察署か ＃９１１０
    - name: 警察相談専用電話（緊急でない相談。緊急は110番）
      number: "#9110"
      spoken: シャープ9110
      crisis: other

# 応答に英字のまま出してよい語（それ以外の英字 3 文字以上は日本語で言い直させる）
allow_ascii: [LINE]

# 江田島市の外なのに、LLM が江田島市の観光地として挙げやすい場所（含む文は読み上げない。WP03 の評価で宮島を繰り返し挙げた）
outside_places: [宮島, 厳島神社]

# 正式名の言い間違いの直し（読み上げ前に置き換える。WP05・WP06 の評価で「江田島観光協会」と言った）
name_fixes:
  - {wrong: 江田島観光協会, correct: 江田島市観光協会}
