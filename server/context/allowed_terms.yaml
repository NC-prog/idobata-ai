# 応答・お知らせの要約に英字（記号）のまま出してよい語と、その読み（WP13）。人間が編集する。
#
# 英字の安全装置（src/dialogue.py の foreign_tokens）:
# - 大文字だけの略語（英字 2〜5 字。PDF・QR・LINE・ATM・ID・URL・HP・SNS・DX・AI・IC・ETC・JR・NHK・LED・USB・FAX・OK・NG など）は、
#   1 応答（お知らせの要約なら 1 本）につき 3 語まで（DialogueConfig.abbrev_max_per_reply）。VOICEVOX は字ごとに読む（PDF→ピイディイエフ）
# - 小文字・大文字小文字の混在の英単語（please・Thank you）は言い直し→捨てる。ただし、ここに置いた語は数えず、
#   読みを VOICEVOX のユーザー辞書に登録する（起動時に拠点の語と一緒に同期する）
# - 英字が 4 語以上、またはピリオドで終わる英字の並び（英文）は、ここの語や略語でも言い直し→捨てる
#
# surface: 表記（そのまま照らす）、reading: カタカナの読み、accent: アクセント核の位置（0 は平板）
terms:
  - {surface: Wi-Fi, reading: ワイファイ, accent: 0}
  - {surface: Web, reading: ウェブ, accent: 1}
  - {surface: km, reading: キロメートル, accent: 3}
  - {surface: kg, reading: キログラム, accent: 3}
  - {surface: cm, reading: センチメートル, accent: 4}
  - {surface: ℃, reading: ド, accent: 1}
