# お知らせの分類（WP11 A-2）。kb/news_classify.py（夜）と server/src/news.py（選ぶ順番）が読む。人間が編集する。
#
# 判定の順: 1) skip の語が題名にある → 紹介しない  2) introduce の語が題名にある → 紹介する
#           3) skip の語が本文の先頭にある → 紹介しない  4) introduce の語が本文の先頭にある → 紹介する
#           5) どれでもなければ LLM（Qwen3-8B、temperature 0）に introduce / skip の二択で聞く
# 語は部分一致。題名を本文より先に見る（本文の「申込」より題名の「入札結果」を重く見る）。

# 紹介しない（住民に広く関係しない・個人名を含みうる・行政の内向きの記事）
skip:
  - 入札
  - 契約
  - 人事
  - 採用試験
  - 職員採用
  - 会計年度任用職員
  - 議会
  - 議員
  - 例規
  - 条例の制定
  - 統計
  - 公告
  - 告示
  - 予算
  - 決算
  - 監査
  - パブリックコメントの結果
  - 意見募集の結果
  - 返礼品
  - ふるさと納税
  - 審議会
  - 委員会の開催
  - 会議の開催
  - 会議録
  - 議事録
  - 指定管理
  - プロポーザル
  - 事業者の皆様
  - 事業者向け
  - 補助金交付決定
  - 落札
  - 財政
  - 計画の策定
  - 満員御礼
  - 受付を終了
  - 終了しました
  - 緊急メンテナンス
  - 地域おこし協力隊
  - 空き家バンク
  - 求人
  # 終わった行事の報告・お礼（A-4 の一致率の見直しで追加）
  - 御礼
  - お詫び
  - ありがとうございました
  # 事業者・店舗向けの募集（同）
  - 協力店
  - 店舗募集
  - 出店者募集
  - 事業所の皆様

# 紹介する（住民に広く関係する案内）
introduce:
  - 通行止め
  - 通行規制
  - 迂回
  - 断水
  - 濁水
  - 停電
  - 休館
  - 休止
  - 臨時休業
  - 中止
  - 延期
  - 開催
  - 募集
  - 申込
  - 申し込み
  - 受付開始
  - 接種
  - 健診
  - 検診
  - 避難
  - 警報
  - 防災
  - 訓練
  - ごみ
  - 収集
  - イベント
  - まつり
  - 祭り
  - 教室
  - 講座
  - 無料
  - 配布
  - 相談会
  - 運休
  - ダイヤ
  # A-4 の一致率の見直しで追加
  - 割引
  - 運行

# 分類（9 つ）。上から順に、題名と本文の先頭に語があるものを選ぶ。無ければ その他
categories:
  - name: 通行止め
    words: [通行止め, 通行規制, 迂回, 道路, 工事, 運休, ダイヤ, 交通規制]
  - name: ライフライン
    words: [断水, 濁水, 停電, 水道, 下水道, ガス, 給水]
  - name: 防災
    words: [避難, 警報, 防災, 訓練, 災害, 地震, 台風, 大雨, 土砂, 熊, クマ, イノシシ]
  - name: 施設
    # 施設の休み・時間の変更（施設の名前だけでは選ばない。行事の会場として出てくるため）
    words: [休館, 休止, 臨時休業, 開館時間, 閉館, 利用休止, 利用停止, 窓口業務, 営業時間]
  - name: ごみ
    words: [ごみ, ゴミ, 収集, 資源, リサイクル, 粗大]
  - name: 健康
    words: [接種, 健診, 検診, ワクチン, 健康, 医療, 献血, 予防]
  - name: 募集
    words: [募集, 申込, 申し込み, 受付開始, 参加者, 応募]
  - name: イベント
    words: [開催, イベント, まつり, 祭り, 教室, 講座, 展示, 大会, 相談会, フェス, マルシェ, 映画]

# 紹介の順番の重み（大きいほど先に出す。B-1: 通行止め・ライフライン・防災 ＞ 施設・ごみ ＞ イベント・募集・健康・その他）
weights:
  通行止め: 3
  ライフライン: 3
  防災: 3
  施設: 2
  ごみ: 2
  イベント: 1
  募集: 1
  健康: 1
  その他: 1

# 申し込みの締め切りの語（この語のある行の日付がすべて過ぎていれば紹介しない）
deadline_words: [申込期限, 申し込み期限, 申込締切, 締切, 締め切り, 受付期間, 申込期間, 申し込み期間, 受付は]

# 期限の語（本文の期間を期限として読む語。A-1）
period_words: [期間, 日時, 日程, 開催日, 期日, とき, 日にち, 通行止め, 断水, 休館, 休止, 受付, 申込, 締切, 締め切り, まで, ～, 〜, から]
