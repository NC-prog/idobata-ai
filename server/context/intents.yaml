# 来訪者の発話の型（WP13 B）。LLM を使わず、語で決める。server/src/intents.py が読む。人間が編集する。
#
# 型: procedure（手続き）/ facility（場所・設備・開庁）/ event（行事）/ tourism（観光）/ weather（天気）/
#     other（上のどれでもない質問）/ smalltalk（上のどれでもなく、質問の形でもない。短い返事・報告・相槌を含む）
# 1 発話に複数当たれば procedure > facility > event > tourism > weather > other > smalltalk。
# procedure は、ここの語に加えて、手続きの別名表（procedures.yaml）・手続きナレッジ（承認済み・下書き）の name / aliases でも当たる。
# 型ごとに毎ターンの検索で渡してよい範囲は KnowledgeConfig.scope_by_intent（config.py）。

