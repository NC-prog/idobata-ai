# 会話で使う知識の範囲（WP13 A）。全拠点に効く、題名の語での用途の規則。kb/build.py が読む。人間が編集する。
#
# 1 ページの用途（use）の決め方（上から順に、最初に決まったもの）:
#   1. URL の規則（区画の use_rules → 拠点の use_rules。sources/<site>.yaml）のうち final: true のもの → その use で確定
#   2. 題名に exclude の語 → exclude（集めない。パックに入れない）
#   3. 題名に dialogue の語で、既定が lookup → dialogue（lookup の区画・課に混ざった暮らしの記事を会話の資料に引き上げる）
#   4. 既定: URL の規則（final でないもの。最初に当たったもの）の use、無ければ区画の use（書かなければ dialogue）
# exclude と dialogue の語が同時に当たる題名（「防災 入札」）は exclude。
# 語は正規表現として当てる（前に付く字で区別する: 「社会福祉協議会」「審議会」は議会ではない、「求人事業主」は人事ではない）
#
# use の 3 値: dialogue（会話の参考資料）/ lookup（「調べる」のときだけ）/ exclude（集めない）

exclude_title_words:
  - 求人情報
  - 入札
  - (?<![協審評])議会
  - 例規
  - 統計
  - (?<!求)人事
  - 公告
  - 予算
  - 決算
  - 監査
  - パブリックコメント

dialogue_title_words:
  # 防災
  - 防災
  - 避難
  - 避難所
  - 警報
  - 気象
  - ハザード
  # ごみ
  - ごみ
  - 収集
  - 粗大
  # 施設の休み・時間・窓口
  - 休館
  - 休業
  - 開庁
  - 開館
  - 窓口
  - 受付時間
  # 交通（「バス」単独は観光バスツアー・企画チケットも上げるので使わない。10/24 の判断）
  - 路線バス
  # 「バス停」は路線・時刻・乗合のどれかが題名にあるか、乗り場が変わる記事のときだけ（浜田省吾さんゆかりのバス停は観光。10/24 の判断）
  - ^(?=.*(路線|時刻|乗合)).*バス停
  - バス停(の)?(位置|移設|変更)
  - 時刻表
  - 乗合
  - コミュニティバス
  - ライドシェア
  - もりカー
  # ライフライン・道路
  - 断水
  - 停電
  - 通行止め
  # 支所
  - 支所
  - 出張所
  # 健康
  - 予防接種
  - 健診
  - 検診
  # 身の安全・相談（江田島の lookup に落ちていた暮らしの記事。10/24 の判断。これ以上は足さない）
  - 詐欺
  - 不審
  - 注意喚起
  - 相談窓口
  - 遭難
