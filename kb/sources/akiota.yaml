# 安芸太田町の知識パックのクロール定義（人間が編集する）
# 中国新聞は robots.txt で AI のクローラ（ClaudeBot・GPTBot など）を明示的に拒否しているので入れない。公式 SNS も入れない。
# サイトの構造（2026-10-21 確認）: /life/<大>/<中>/<小>/（くらし・子育て等）、/soshiki/<課>/<番号>.html、
# /site/<サブサイト>/。robots.txt は無い（404）。観光は町のサイトが案内する「あきおおたから」
# （cs-akiota.or.jp、一般社団法人 地域商社あきおおた。robots.txt で wp-admin 等以外は許可）。
site: akiota
default_trust: official
default_label: 町のホームページ
allow_domains:
  - www.akiota-shakyo.jp
  - dive-hiroshima.com
  - www.akiota.jp
  - cs-akiota.or.jp
seeds:
  - url: https://www.akiota.jp/soshiki/
    depth: 2
    include: ["/soshiki/7/", "/soshiki/8/", "/soshiki/9/", "/soshiki/10/", "/soshiki/13/", "/soshiki/14/", "/soshiki/19/", "/soshiki/20/", "/soshiki/21/", "/soshiki/22/", "/soshiki/24/"]
    exclude: &akiota_exclude [".pdf", "/life/3/17/", "/life/4/", "/site/gikai/", "/site/saiyou/", "/site/chocho-shitsu/", "/soshiki/2/", "/soshiki/23/", "/life/2/16/121/"]
  - url: https://www.akiota.jp/calendar/      # 行事
    depth: 1
    include: ["/soshiki/", "/site/", "/calendar/"]
    exclude: *akiota_exclude
    daily: true
  - url: https://cs-akiota.or.jp/news/category/イベント/
    use: lookup
    why: 観光・道の駅（WP13）
    depth: 1
    include: ["/news/"]
    exclude: ["/wp-admin/", "add-to-cart", "/cart", "/my-account"]
    trust: semi
    label: あきおおたからのホームページ
    daily: true
  - url: https://cs-akiota.or.jp/special/category/観光/
    use: lookup
    why: 観光・道の駅（WP13）
    depth: 1
    include: ["/special/"]
    exclude: ["/wp-admin/", "add-to-cart", "/cart", "/my-account"]
    trust: semi
    label: あきおおたからのホームページ
  # 手続きナレッジの出典（WP09。2026-10-23 に町のサイトの教育課のページ /soshiki/14/ から URL を確認）。
  # 就学援助（転校・入学）と、黎明館の交流スペースの利用（公共施設の利用）。毎朝の差分で取り直し、出典の再確認に使う
  - url: https://www.akiota.jp/soshiki/14/
    depth: 1
    include: ['/site/kyoiku/8264\.html$', '/site/kyoiku/10011\.html$']
    exclude: *akiota_exclude
    daily: true
  # 就学援助（/site/kyoiku/17778.html）は本文が PDF の案内だけでチャンクにならないので入れない
  # 町の新着・重要なお知らせ・トピックス（RSS 1.0）。入札（list8）は入れない
  - url: https://www.akiota.jp/rss/10/list1.xml
    use: lookup
    why: 混在（10/24 の「協調学習」はここから）。急ぎの案内は WP11 のお知らせ。題名の引き上げ語の記事は dialogue（WP13）
    depth: 1
    include: ["/soshiki/", "/site/", "/life/"]
    exclude: *akiota_exclude
    daily: true
  - url: https://www.akiota.jp/rss/10/list3.xml
    use: lookup
    why: 混在（10/24 の「協調学習」はここから）。急ぎの案内は WP11 のお知らせ。題名の引き上げ語の記事は dialogue（WP13）
    depth: 1
    include: ["/soshiki/", "/site/", "/life/"]
    exclude: *akiota_exclude
    daily: true
  - url: https://www.akiota.jp/rss/10/list6.xml
    use: lookup
    why: 混在（10/24 の「協調学習」はここから）。急ぎの案内は WP11 のお知らせ。題名の引き上げ語の記事は dialogue（WP13）
    depth: 1
    include: ["/soshiki/", "/site/", "/life/"]
    exclude: *akiota_exclude
    daily: true
  # 道の駅 来夢とごうち（建て替えで休館中、令和10年3月再開予定。案内はあきおおたからに載る）
  - url: https://cs-akiota.or.jp/special/category/道の駅/
    use: lookup
    why: 観光・道の駅（WP13）
    depth: 1
    include: ["/special/", "/news/raimutogouchi"]
    exclude: ["/wp-admin/", "add-to-cart", "/cart", "/my-account"]
    trust: semi
    label: 道の駅のお知らせ
  # 安芸太田町社会福祉協議会
  - url: https://www.akiota-shakyo.jp/news/feed/
    use: lookup
    why: ブログ的な記事（WP13）
    depth: 1
    include: ['^https://www\.akiota-shakyo\.jp/news/\d+/?$']
    trust: semi
    label: 社会福祉協議会のホームページ
    daily: true
  - url: https://www.akiota-shakyo.jp/wp-sitemap.xml
    use_rules:
      - {pattern: '/(news|event)(/|$)', use: lookup, why: 社協だより・事業計画・行事（ブログ的な記事）}
    sitemap: true
    depth: 1
    include: ['^https://www\.akiota-shakyo\.jp/(news/\d+|event/\d+|gaiyo|jigyo(/[a-z]+)?|news|event)?/?$']
    exclude: ['/(contact|event)_(confirm|complete)/', '/contact/', '/hello-world/', '/privacypolicy/', '/wp-', '/author/']
    trust: semi
    label: 社会福祉協議会のホームページ
  # Dive! Hiroshima（県の観光サイト）。本文に「安芸太田町」を含む名所・行事だけ
  - url: https://dive-hiroshima.com/sitemap.xml
    use: lookup
    why: 観光（WP13）
    sitemap: true
    depth: 1
    include: ['^https://dive-hiroshima\.com/(explore/\d+|events/events-\d+(-\d+)?)/$']
    exclude: ['/(en|kr|tw|cn|fr|de|th)/', '/business/', '\?']
    require_text: [安芸太田町]
    max_fetches: 400
    recheck_days: 7
    trust: semi
    label: 県の観光サイト
  # 町のサイトの大きな区画（くらし・子育て）は最後に回す（取得の上限で、後ろのソースが取れなくなるのを防ぐ）
  - url: https://www.akiota.jp/life/1/        # くらし
    depth: 3
    include: ["/soshiki/", "/life/", "/site/"]
    exclude: *akiota_exclude
  - url: https://www.akiota.jp/life/2/        # 子育て・教育
    depth: 3
    include: ["/soshiki/", "/life/", "/site/kosodate/"]
    exclude: *akiota_exclude
# ---- お知らせ（WP11 A-1）。町のトップページの「新着情報」「重要なお知らせ」「トピックス」の RSS 1.0（2026-10-24 確認。
# 各記事に dc:date（掲載日）があり、行事は nc:event_sdate / nc:event_edate に期間が入る）。入札（list8）・空き家バンク（list5）・
# 町内求人（list7）は入れない。行事も新着情報に載る（森のアドベンチャーサイクルフェスなど）
news:
  label: 町のホームページ
  feeds:
    - {url: "https://www.akiota.jp/rss/10/list1.xml", type: rss}
    - {url: "https://www.akiota.jp/rss/10/list3.xml", type: rss}
    - {url: "https://www.akiota.jp/rss/10/list6.xml", type: rss}
  include: ['^https://www\.akiota\.jp/(soshiki|site|life)/.+\.html$']
  exclude: ["/site/gikai/", "/site/saiyou/", "/site/chocho-shitsu/", "/site/furusatonouzei/", "/soshiki/2/", "/soshiki/23/"]
# ---- 会話で使う範囲（WP13 A）。課のページは RSS・くらしの区画からも入ってくるので、拠点の URL の規則で分ける（上から順に）。
# final: true の規則はそこで確定。それ以外の規則は「既定」を差し替え、題名の語の規則（kb/scope_rules.yaml: exclude → dialogue への
# 引き上げ）はその後に効く（総務課を lookup にしても、題名に「防災」「気象」の記事は dialogue）
use_rules:
  - {pattern: '/site/kyoiku/(8264|10011)\.html$', use: dialogue, final: true, why: 手続きナレッジの出典（就学援助・黎明館）}
  - {pattern: '/soshiki/list7-', use: lookup, final: true, why: 町内求人情報の一覧（「求人がある」ことは言える。題名の exclude より先）}
  - {pattern: '/site/userguide/|/soshiki/list[0-9]', use: exclude, final: true, why: サイトの使い方・新着一覧の一覧ページ}
  - {pattern: '/soshiki/8/', use: lookup, why: 産業観光課（補助金・観光・職業紹介。職業紹介所は手続きナレッジの就労で答える）}
  - {pattern: '/soshiki/25/', use: lookup, why: 道の駅推進チーム}
  - {pattern: '/soshiki/5/', use: lookup, why: 企画DX課（計画・SNS。ライドシェア・もりカーは題名の引き上げで dialogue）}
  - {pattern: '/soshiki/3/', use: lookup, why: 総務課（指定管理・計画・方針。防災気象情報は題名の引き上げで dialogue）}
  - {pattern: '/soshiki/(18|22)/', use: lookup, why: 農業委員会・筒賀支所（委員名簿・プロジェクト。支所の窓口案内は題名の引き上げで dialogue）}
  - {pattern: '/site/(ijyu|furusatonouzei|profile|kouhou|bbikou|morica)/', use: lookup, why: 移住・空き家、ふるさと納税、町のプロフィール、広報、ブロードバンド、地域通貨}
  - {pattern: '/site/kyoiku/', use: lookup, why: 大会・事業・プロポーザルが多い}
  - {pattern: '/life/3/', use: lookup, why: 事業者向け}
exclude_breadcrumb_keywords: [議会, 会議録, 入札, 職員採用, 人事, 町長の部屋, 選挙]
exclude_title_keywords: [議事録, 会議録, 入札, 人事異動, 職員採用, 叙勲, 褒章, 表彰, 議員, の皆様をご紹介]
weather:
  provider: jma
  area_code: "340000"
  area_sub_code: "340020"    # 一次細分区域: 北部
  pref_name: 広島県
  amedas:                    # 気温はアメダスの実況（予報の代表点 庄原 は町から遠いので使わない）
    station_id: "67212"      # 加計（アメダス地点一覧 amedastable.json で確認）
    station_name: 加計
    place_name: 安芸太田
    in_site: true            # 観測点が町の中 →「安芸太田は今〇度くらい」と言う
crawl:
  rate_limit_sec: 1.0
  user_agent: "idobata-ai-kb/0.1 (+Fuji Seisakusho LLC; municipal lobby guide pilot)"
  respect_robots: true
  max_pages: 1200
  max_fetches: 4000

# ---- 調べる（WP04 A-3）。来訪者が同意したときに、その場で見に行く先（許可ドメインだけ）----
# 町のサイト内検索は Google のカスタム検索（外部）なので使わない。RSS・一覧で探す
lookup:
  - {name: 町の新着, type: list, url: "https://www.akiota.jp/rss/10/list1.xml"}
  - {name: 町のトピックス, type: list, url: "https://www.akiota.jp/rss/10/list6.xml"}
  - {name: 町の行事カレンダー, type: list, url: "https://www.akiota.jp/calendar/"}
  - {name: あきおおたからのイベント, type: list, url: "https://cs-akiota.or.jp/news/category/イベント/", trust: semi, label: あきおおたからのホームページ}
  - {name: 道の駅のお知らせ, type: list, url: "https://cs-akiota.or.jp/special/category/道の駅/", trust: semi, label: 道の駅のお知らせ}
  - {name: 社会福祉協議会のサイト内検索, type: search, url: "https://www.akiota-shakyo.jp/?s={q}", trust: semi, label: 社会福祉協議会のホームページ}
